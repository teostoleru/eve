<style>
    .flipbook-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%; 
        margin: 20px 0;
        overflow: hidden;
    }

    .custom-flip-book {
        box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.3);
        display: none; 
        width: 100%;
        height: 100%;
    }

    .custom-page {
        background-color: white;
        overflow: hidden;
    }

    /* 🌟 NEW: Makes the dummy pages completely invisible */
    .custom-page.dummy-page {
        background-color: transparent;
    }

    .custom-page canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #flipbook-loading {
        font-family: sans-serif;
        font-size: 1.2rem;
        color: #666;
        text-align: center;
        padding: 50px 0;
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

<div class="flipbook-wrapper" id="flipbook-wrapper">
    <div id="flipbook-loading">Loading Lookbook...</div>
    <div class="custom-flip-book" id="custom-flipbook"></div>
</div>

<script>
    (function() {
        const PDF_URL = 'https://raw.githubusercontent.com/teostoleru/eve/main/2025.04%20London%20Marathon.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const wrapperElement = document.getElementById('flipbook-wrapper');
        const flipbookElement = document.getElementById('custom-flipbook');
        const loadingElement = document.getElementById('flipbook-loading');

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(PDF_URL);
                const pdf = await loadingTask.promise;
                const numPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const renderScale = 1.5; 
                const viewport = firstPage.getViewport({ scale: renderScale });
                const pdfWidth = viewport.width;
                const pdfHeight = viewport.height;

                wrapperElement.style.aspectRatio = `${pdfWidth * 2} / ${pdfHeight}`;

                // 1. Add the TRANSPARENT dummy page FIRST
                createDummyPage();

                // 2. Render all real PDF pages
                for (let i = 1; i <= numPages; i++) {
                    await renderPage(pdf, i, renderScale);
                }

                // 3. Balance the pages (add transparent to back if odd)
                if ((numPages + 1) % 2 !== 0) {
                    createDummyPage();
                }

                loadingElement.style.display = 'none';
                flipbookElement.style.display = 'block';

                const pageFlip = new St.PageFlip(flipbookElement, {
                    width: pdfWidth,     
                    height: pdfHeight,   
                    size: "stretch",     
                    minWidth: 200,
                    maxWidth: 4000,      
                    minHeight: 200,
                    maxHeight: 4000,     
                    maxShadowOpacity: 0.3,
                    usePortrait: false,  
                    showCover: false,    
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(flipbookElement.querySelectorAll('.custom-page'));

            } catch (error) {
                console.error("Error loading PDF: ", error);
                loadingElement.innerText = "Error loading Lookbook. Please try refreshing the page.";
            }
        }

        // 🌟 UPDATED: Now applies the transparent 'dummy-page' class
        function createDummyPage() {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'custom-page dummy-page'; 
            flipbookElement.appendChild(pageDiv);
        }

        async function renderPage(pdf, pageNumber, scale) {
            const page = await pdf.getPage(pageNumber);
            const viewport = page.getViewport({ scale: scale });

            const pageDiv = document.createElement('div');
            pageDiv.className = 'custom-page';

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            pageDiv.appendChild(canvas);
            flipbookElement.appendChild(pageDiv);
        }

        initFlipbook();
    })();
</script>
